name: Production Monitor

on:
  schedule:
    # GitHub schedules are best-effort; fifteen minutes is enough for this
    # free portfolio service and avoids creating unnecessary traffic.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: External production probe
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Probe health, readiness, and Prometheus metrics
        env:
          MONITOR_BASE_URL: https://campus-library-chatbot-api.onrender.com
        run: python scripts/production_monitor.py

      - name: Create or update an incident issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] Production API probe failed";
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "production-alert",
                color: "B60205",
                description: "Created automatically when the production probe fails",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "production-alert",
            });
            const body = [
              "The scheduled external probe could not validate `/health`, `/ready`, or `/metrics`.",
              "",
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Follow `docs/OPERATIONS.md` before making production changes.",
            ].join("\n");
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["production-alert"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

      - name: Close recovered incident issues
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "production-alert",
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in workflow run ${context.runId}; the external probe is healthy again.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed",
              });
            }
